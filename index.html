<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Croqui de Campo</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1557d6">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* VOICE: ferramenta de campo, objetiva, de prancheta — nada decorativo.
   IDEA: a caderneta de levantamento: papel quadriculado, lápis e trena.
   PICTURE: o próprio desenho ocupa a tela inteira; o resto são controles.
   COLOUR and TYPE: papel claro, grafite, vermelho para pilares, laranja para estimado; fonte do sistema.
   LAYOUT: barra superior fina, prancheta ao centro, status + ferramentas no polegar. */
:root{color-scheme:light dark;
--bg:light-dark(#f6f5f0,#15181c);--paper:light-dark(#fbfaf6,#1b1f24);--ink:light-dark(#1d232b,#e8eaed);--muted:light-dark(#6b7280,#9aa3ad);
--line:light-dark(#dcd9cf,#2c323a);--grid:light-dark(#ebe8de,#232830);--grid2:light-dark(#d9d5c8,#2e353e);
--wall:light-dark(#c9cfd6,#3d4650);--accent:light-dark(#1557d6,#6aa1ff);--red:#d62828;--orange:light-dark(#c96a00,#f0a040);
--cyan:light-dark(#0a7ea4,#4cc3e8);--mag:light-dark(#a1239b,#e07ad9);--ok:light-dark(#1f7a3a,#5fd38a);--onacc:light-dark(#ffffff,#0b1220);--panel:light-dark(#ffffff,#20252b)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}
/* lista */
#home{height:100%;overflow:auto;padding:20px 16px 96px}
#home h1{font-size:32px;line-height:1.05;margin:8px 0 4px;letter-spacing:-.01em}
#home .sub{color:var(--muted);margin:0 0 20px;max-width:60ch}
.cards{display:grid;gap:10px;max-width:720px}
.card{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 8px 12px 14px}
.card .main{flex:1;text-align:left;padding:4px 0}
.card .nm{font-weight:600;display:block}.card .meta{color:var(--muted);font-size:14px}
.thumb{width:64px;height:52px;flex:none;border-radius:6px;background:var(--paper);border:1px solid var(--line)}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:10px;flex:none}
.iconbtn:active{background:var(--line)}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:24px;color:var(--muted);max-width:720px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));background:var(--accent);color:var(--onacc);border-radius:14px;padding:0 20px;height:52px;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.linkbtn{color:var(--accent);font-weight:600;padding:10px 0;min-height:44px}
/* editor */
#editor{position:fixed;inset:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:2px;padding:2px 4px;background:var(--panel);border-bottom:1px solid var(--line);min-height:48px}
.top .title{flex:1;text-align:left;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px;min-height:44px}
.top .iconbtn:disabled{opacity:.35}
.top .iconbtn{width:40px}
.stage{position:relative;flex:1;background:var(--paper);overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hint{position:absolute;left:8px;right:8px;top:8px;font-size:13px;color:var(--muted);background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:8px;padding:6px 10px;pointer-events:none;max-width:520px}
.status{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;background:var(--panel);border-top:1px solid var(--line)}
.status #stat{flex:1;font-size:14px;color:var(--muted)}
.status #stat b{color:var(--ink);font-weight:600}.status #stat .warn{color:var(--orange);font-weight:600}
.pill{height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);font-weight:600;font-size:15px}
.pill:disabled{opacity:.4}
.pill.pri{background:var(--accent);border-color:var(--accent);color:var(--onacc)}
.tools{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tools button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 8px;font-size:10.5px;color:var(--muted);min-height:56px}
.tools button[aria-pressed=true]{color:var(--accent);font-weight:600;box-shadow:inset 0 3px 0 var(--accent)}
/* folha inferior */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.08)}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:60vh;overflow:auto;background:var(--panel);border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.2);padding:8px 16px calc(16px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
#sheet .grab{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;padding:2px 0 8px;min-height:30px}
#sheet .grab span{width:40px;height:4px;border-radius:2px;background:var(--line)}
#sheet .grab em{font-style:normal;font-size:12px;color:var(--muted)}
#sheet.min{max-height:118px;overflow:hidden}
.ab{display:flex;align-items:center;gap:10px;margin:-4px 0 12px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;font-size:14px;color:var(--ink)}
.ab svg{flex:none;color:var(--ink)}
#sheet h2{font-size:20px;margin:0 0 12px;line-height:1.2}
#sheet p{margin:0 0 12px;color:var(--muted);font-size:15px}
.f{display:grid;gap:4px;margin-bottom:12px}
.f label,.lab{font-size:14px;color:var(--muted)}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px;width:100%}
input.big{font-size:24px;font-weight:600;letter-spacing:.01em}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;min-height:42px;font-size:14px;padding:0 4px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--onacc);font-weight:600}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.acts .pill{flex:1 1 auto;height:46px}
.pill.danger{color:var(--red)}
.list{border:1px solid var(--line);border-radius:10px;margin:0 0 12px}
.list>div{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border-top:1px solid var(--line);font-size:15px}
.list>div:first-child{border-top:0}
.list>div span{flex:1}
.menu button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 4px;min-height:52px;border-top:1px solid var(--line)}
.menu button:first-of-type{border-top:0}
.menu small{display:block;color:var(--muted);font-size:13px}
.rep{font-size:15px;margin:0 0 12px}.rep li{margin:4px 0}
.okc{color:var(--ok);font-weight:600}.badc{color:var(--orange);font-weight:600}
ol.help{padding-left:20px;margin:0 0 12px}ol.help li{margin:6px 0}
#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;max-width:88vw;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media (min-width:900px){.tools{grid-template-columns:repeat(7,104px);justify-content:center}}
#fbar{position:absolute;display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:0 4px 14px rgba(0,0,0,.18);z-index:2}
#fbar button{height:40px;padding:0 10px;border-radius:8px;font-size:14px;font-weight:600;white-space:nowrap}
#fbar button:active{background:var(--line)}
#fbar .danger{color:var(--red)}
.okt{color:var(--ok);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chips button{border:1px solid var(--line);border-radius:999px;padding:0 12px;min-height:38px;font-size:13px;font-weight:600}
.chips button:active{background:var(--line)}
#bIma{position:relative;width:40px}
#bIma[aria-pressed=true]{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
#bIma .ima-t{position:absolute;bottom:1px;left:0;right:0;font-size:9px;font-weight:700;text-align:center}
#b3d{width:40px}
#v3d{position:fixed;inset:0;z-index:5;background:var(--paper)}
#cv3{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.v3bar{position:absolute;left:8px;right:8px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.v3bar .pill{background:var(--panel);height:46px}.v3bar .pill.pri{background:var(--accent)}
.v3hint{position:absolute;top:10px;left:0;right:0;text-align:center;font-size:13px;color:var(--muted);margin:0;pointer-events:none}
.models{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:4px 0 14px}
.models button{display:flex;align-items:center;gap:10px;text-align:left;min-height:52px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;font-size:14px;line-height:1.2}
.models button[aria-pressed=true]{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--panel));font-weight:600}
.models svg.i{flex:none;width:28px;height:28px}
.models.mats{grid-template-columns:repeat(4,minmax(0,1fr))}
.models.mats button{flex-direction:column;justify-content:center;gap:2px;font-size:12px;min-height:58px;text-align:center;padding:6px 2px}
.dbox{border:1.5px solid var(--accent);border-radius:12px;padding:10px 12px 2px;margin:0 0 12px;background:color-mix(in srgb,var(--accent) 6%,var(--panel))}
.dbox p{color:var(--ink)}
</style>
</head>
<body>
<section id="home">
  <h1>Levantamentos</h1>
  <p class="sub">Croqui com o dedo ou por foto, medidas da trena, cortes e saída em DXF para o AutoCAD.</p>
  <div class="cards" id="cards"></div>
  <p><button class="linkbtn" id="bImport">Importar backup (.json)</button></p>
  <p><button class="linkbtn" id="bInstall" hidden>Instalar o app neste celular</button></p>
  <p id="offStat" style="font-size:14px;margin:4px 0 0"></p>
  <input type="file" id="fImport" accept=".json,application/json" hidden>
  <button class="fab" id="bNew"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Novo levantamento</button>
</section>

<section id="editor" hidden>
  <header class="top">
    <button class="iconbtn" id="bBack" aria-label="Voltar à lista"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="title" id="bTitle">Levantamento</button>
    <button class="iconbtn" id="bUndo" aria-label="Desfazer"><svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
    <button class="iconbtn" id="bRedo" aria-label="Refazer"><svg class="i" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg></button>
    <button class="iconbtn" id="bIma" aria-label="Ímã desligado" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><path d="M6 4v8a6 6 0 0012 0V4h-4v8a2 2 0 01-4 0V4z"/><path d="M6 8h4M14 8h4"/></svg><span class="ima-t"></span></button>
    <button class="iconbtn" id="b3d" aria-label="Vista 3D"><b style="font-size:15px;letter-spacing:.02em">3D</b></button>
    <button class="iconbtn" id="bMore" aria-label="Mais opções"><svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></button>
  </header>
  <div class="stage" id="stage"><canvas id="cv"></canvas><div class="hint" id="hint"></div>
    <div id="fbar" hidden><button data-f="rot">↻ 90°</button><button data-f="rot15">↻ 15°</button><button data-f="ed">Medidas</button><button data-f="del" class="danger">Excluir</button></div></div>
  <div class="status"><span id="stat"></span><button class="pill" id="bMeasure">Medir</button><button class="pill pri" id="bAdjust">Conferir</button></div>
  <nav class="tools" id="tools">
    <button data-mode="parede" aria-pressed="true"><svg class="i" viewBox="0 0 24 24"><path d="M5 19L19 5"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="5" r="2"/></svg>Parede</button>
    <button data-mode="editar"><svg class="i" viewBox="0 0 24 24"><path d="M6 3l12 9-5.5 1.2L15 20l-2.5 1-2.6-6.6L6 18z"/></svg>Editar</button>
    <button data-mode="pilar"><svg class="i" viewBox="0 0 24 24"><rect x="8" y="5" width="8" height="14" fill="currentColor" stroke="none"/></svg>Pilar</button>
    <button data-mode="texto"><svg class="i" viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg>Texto</button>
    <button data-mode="diag"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14"/><path d="M4 19L20 5" stroke-dasharray="2 2.5"/></svg>Diagonal</button>
    <button data-mode="linha"><svg class="i" viewBox="0 0 24 24"><path d="M3 15h18" /><path d="M6 15l-2 4M11 15l-2 4M16 15l-2 4M21 15l-2 4" stroke-width="1.2"/><circle cx="8" cy="8" r="2.5"/><path d="M4.5 8h7M8 4.5v7"/></svg>Linha</button>
    <button data-mode="corte"><svg class="i" viewBox="0 0 24 24"><path d="M3 12h18" stroke-dasharray="5 2 1.5 2"/><path d="M4 12V6M20 12V6M2 8l2-2 2 2M18 8l2-2 2 2"/></svg>Corte</button>
  </nav>
</section>

<section id="v3d" hidden aria-label="Vista 3D">
  <canvas id="cv3"></canvas>
  <div class="v3bar"><button class="pill" id="v3Cover">Tirar cobertura</button><button class="pill" id="v3Reset">Recentrar</button><button class="pill pri" id="v3Close">Fechar 3D</button></div>
  <p class="v3hint">Um dedo gira · dois dedos: zoom e mover</p>
</section>
<div id="scrim" hidden></div>
<div id="sheet" hidden role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div>

<script>
/* ===== NÚCLEO: geometria, ajuste às medidas, DXF, zip (sem DOM) ===== */
const Core = (() => {
  const EPS = 1e-9;
  let seq = 0;
  const uid = (p) => p + Date.now().toString(36).slice(-5) + (seq++).toString(36) + Math.random().toString(36).slice(2, 5);
  const fmt = (v, d = 2) => (Math.round(v * 10 ** d) / 10 ** d).toFixed(d).replace('.', ',');
  const fmtLev = (v) => Math.abs(v) < 0.005 ? '±0,00' : (v > 0 ? '+' : '-') + fmt(Math.abs(v));
  const parseNum = (s) => {
    if (s === null || s === undefined) return null;
    const t = String(s).trim().replace(/\s/g, '').replace(',', '.');
    if (t === '') return null;
    const v = Number(t);
    return Number.isFinite(v) ? v : null;
  };
  const sub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y });
  const add = (a, b) => ({ x: a.x + b.x, y: a.y + b.y });
  const mul = (a, k) => ({ x: a.x * k, y: a.y * k });
  const dot = (a, b) => a.x * b.x + a.y * b.y;
  const cross = (a, b) => a.x * b.y - a.y * b.x;
  const len = (a) => Math.hypot(a.x, a.y);
  const unit = (a) => { const l = len(a); return l < EPS ? { x: 1, y: 0 } : { x: a.x / l, y: a.y / l }; };
  const perp = (u) => ({ x: -u.y, y: u.x });

  function newProject(name) {
    return {
      v: 4, id: uid('L'), name: name || 'Levantamento',
      info: { obra: '', local: '', coord: '', data: new Date().toISOString().slice(0, 10), resp: '', obs: '' },
      settings: { t: 0.15, ref: 'interna', pd: 2.80, top: 'laje', lajeT: 0.10, roof: { aguas: 2, i: 0.30, beiral: 0.50, cum: 'H', queda: 'baixo', forro: true, telha: 'Telha cerâmica' } },
      nodes: [], walls: [], pillars: [], labels: [], cuts: [], lines: [],
      createdAt: Date.now(), updatedAt: Date.now()
    };
  }

  /* compatibiliza levantamentos salvos em versões anteriores */
  function normalize(p) {
    p.nodes = p.nodes || []; p.walls = p.walls || []; p.pillars = p.pillars || []; p.labels = p.labels || []; p.cuts = p.cuts || []; p.lines = p.lines || [];
    p.info = p.info || {};
    p.settings = Object.assign({ t: 0.15, ref: 'interna', pd: 2.80, top: 'laje', lajeT: 0.10 }, p.settings || {});
    p.settings.roof = Object.assign({ aguas: 2, i: 0.30, beiral: 0.50, cum: 'H', queda: 'baixo', forro: true, telha: 'Telha cerâmica' }, p.settings.roof || {});
    if (!p.v || p.v < 2) { for (const pl of p.pillars) pl.rot = pl.rot === 1 ? 90 : (pl.rot || 0); p.v = 2; }
    if (p.v < 3) { for (const w of p.walls) if (w.kind !== 'verif') w.ori = 'L'; p.v = 3; }
    if (p.v < 4) { for (const w of p.walls) if (w.kind === 'verif') w.use = false; p.v = 4; }
    for (const w of p.walls) { w.ops = (w.ops || []).filter((o) => !o._tmp); if (w.kind !== 'verif') { w.mat = w.mat || 'alv'; w.bulge = w.bulge || 0; } }
    return p;
  }
  const nodeMap = (p) => { const m = new Map(); for (const n of p.nodes) m.set(n.id, n); return m; };
  const paredes = (p) => p.walls.filter((w) => w.kind !== 'verif');
  const wallNumber = (p, w) => paredes(p).indexOf(w) + 1;

  function classifyOri(dx, dy) {
    const a = Math.abs(Math.atan2(dy, dx) * 180 / Math.PI);
    if (a < 8 || a > 172) return 'H';
    if (Math.abs(a - 90) < 8) return 'V';
    return 'L';
  }

  /* espessura da parede "transversal" que encosta na ponta (nó) da parede w */
  function adjT(p, w, nodeId, nm) {
    nm = nm || nodeMap(p);
    const A = nm.get(w.a), B = nm.get(w.b);
    const u = unit(sub(B, A));
    let best = 0, bestS = 0.5;
    for (const o of p.walls) {
      if (o === w || o.kind === 'verif') continue;
      if (o.a !== nodeId && o.b !== nodeId) continue;
      const v = unit(sub(nm.get(o.b), nm.get(o.a)));
      const s = Math.abs(cross(u, v));
      if (s > bestS) { bestS = s; best = o.t; }
    }
    return best;
  }


  /* pontas de uma linha de verificação: eixos ou cantos internos */
  function verifEnds(p, w, nm, corners) {
    const A = nm.get(w.a), B = nm.get(w.b);
    if (w.ref !== 'interna' || !corners) return [A, B];
    const pick = (nid, N, toward) => {
      const cs = corners.get(nid); if (!cs || !cs.length) return N;
      let best = N, bd = Infinity;
      for (const c of cs) { const d = len(sub(c, toward)); if (d < bd) { bd = d; best = c; } }
      return best;
    };
    return [pick(w.a, A, B), pick(w.b, B, A)];
  }
  /* comprimento de eixo correspondente à medida de campo */
  function axisTarget(p, w, nm) {
    if (w.len == null) return null;
    if (w.kind === 'verif') {
      if (w.ref !== 'interna') return w.len;
      const [a, b] = verifEnds(p, w, nm, geometry(p, { cotas: false }).corners);
      return w.len + len(sub(nm.get(w.b), nm.get(w.a))) - len(sub(b, a));
    }
    const k = w.ref === 'interna' ? 1 : w.ref === 'externa' ? -1 : 0;
    if (!k) return w.len;
    return w.len + k * (adjT(p, w, w.a, nm) / 2 + adjT(p, w, w.b, nm) / 2);
  }
  /* deslocamento do início de medida em relação ao nó (para aberturas e cotas) */
  function refShift(p, w, nodeId, nm) {
    const k = w.ref === 'interna' ? 1 : w.ref === 'externa' ? -1 : 0;
    return k * adjT(p, w, nodeId, nm) / 2;
  }

  /* ---------- sistema linear (eliminação de Gauss com pivotamento) ---------- */
  function solveLinear(M, r) {
    const n = r.length;
    for (let c = 0; c < n; c++) {
      let piv = c, mx = Math.abs(M[c][c]);

function helpSheet() {
  openSheet(`<h2>Como usar</h2><ol class="help">
    <li><b>Começar:</b> desenhe à mão ou use "Começar por foto do croqui" (precisa da chave da API e de internet). Nos dados do levantamento, "Usar GPS do celular" preenche as coordenadas.</li>
    <li><b>Parede:</b> desenhe à mão livre. Um traço reto vira uma parede; contornando o ambiente sem tirar o dedo, cada lado vira uma parede e as quinas são endireitadas. Encaixa na horizontal/vertical, nos pontos e nas paredes existentes (cria o "T"). A lupa no canto mostra a ponta sob o dedo e, depois da 1ª medida, o comprimento.</li>
    <li><b>Linhas auxiliares:</b> ao desenhar ou arrastar um ponto, uma linha tracejada roxa aparece quando ele está alinhado (na mesma vertical ou horizontal) com um canto já desenhado, como o da parede oposta. Sem o ímã, o ponto também "puxa" para esse alinhamento.</li>
    <li><b>Ímã (botão do ímã no topo):</b> liga o encaixe na quadrícula, a cada 1 m ou 0,50 m. Toque de novo para trocar ou desligar. Desenhando no tamanho real com o ímã, a 1ª medida quase não muda o desenho.</li>
    <li><b>Medir:</b> percorre as paredes sem medida. A 1ª medida dá escala ao croqui inteiro. Depois, o desenho fica travado e só a parede editada muda: escolha se a diferença vai para o lado A, para o lado B ou se divide, e se as paredes ligadas andam junto (mantém ângulos) ou giram.</li>
    <li><b>Tipo de parede e curva:</b> na folha da parede escolha Alvenaria, Cobogó, Gradil ou Vidro. Para parede redonda, informe a flecha (do meio da corda até a parede) ou, no modo Editar, arraste o número da parede.</li>
    <li><b>Selecionar parede:</b> toque nela ou no número dela. Se pegar a vizinha, toque de novo no mesmo lugar para alternar. Com a folha aberta, tocar em outra parede no desenho já abre a folha dela.</li>
    <li><b>Portas e janelas:</b> dentro de cada parede: escolha o tipo, largura, altura, peitoril e a distância do canto A.</li>
    <li><b>Pilar:</b> toque para colocar; no canto ele alinha com a parede. Toque no pilar para a barra (girar 90°, 15°, medidas); tocar de novo no selecionado gira 90°.</li>
    <li><b>Ambientes e textos:</b> ao fechar um ambiente, o app pergunta o nome (botões rápidos: SALA, QUARTO, BWC…) e coloca o texto no centro com a área interna e uma observação opcional; o texto acompanha as medidas. Com a ferramenta Texto, toque dentro de um ambiente para nomeá-lo ou em qualquer lugar para uma observação. Arraste o texto no modo Editar para reposicionar.</li>
    <li><b>Nível do piso:</b> na folha do ambiente (ferramenta Texto) preencha "Nível do piso" (ex.: ±0,00, +0,15, -0,05); sai o símbolo de nível com a cota. Também dá para pôr só o nível, sem nome, em qualquer ponto.</li>
    <li><b>Linha:</b> traça linhas que não são parede. <i>Desnível</i>: informe o nível do lado A e do lado B (marcados no desenho) e o app mostra o desnível em cm; <i>Projeção</i>: linha tracejada (laje, beiral, marquise); <i>Outra linha</i>. Toque na linha para editar ou excluir.</li>
    <li><b>Sem internet:</b> na versão instalada pelo GitHub, abra o app uma vez com internet; a faixa verde "Pronto para usar sem internet" confirma. Depois funciona no modo avião.</li>
    <li><b>Diagonal:</b> confere o esquadro do ambiente (medida entre cantos internos × desenho).</li>
    <li><b>Corte:</b> arraste atravessando a planta. O corte sai abaixo dela com pé-direito, laje, forro ou telhado, peitoris, alturas e cotas.</li>
    <li><b>3D (botão no topo):</b> mostra o levantamento em 3D com portas, janelas, pilares e cobertura. Um dedo gira; dois dedos dão zoom e movem. "Tirar cobertura" mostra o interior.</li>
    <li><b>Apagar todo o desenho (menu ⋯):</b> limpa o croqui de uma vez; Desfazer recupera.</li>
    <li><b>Conferir:</b> lista as medidas que não batem com o desenho e as diagonais.</li>
    <li><b>Exportar (menu ⋯):</b> baixa o .dxf para a pasta Downloads (o backup .json fica em "Salvar backup"). No AutoCAD, abra o .dxf: unidades em metros, layers PAREDES, ESQUADRIAS, PILARES, COTAS, COTAS-ESTIMADAS, VERIFICACAO, TEXTOS, CORTES, CORTE-PAREDES, CORTE-LAJE, CORTE-TELHADO, NIVEIS, DESNIVEL, PROJECAO (tracejada), LINHAS, INFO.</li></ol>
    <p>Dois dedos: mover e zoom. Desfazer e refazer no topo. No modo Editar, arraste pontos, pilares e textos.</p>
    <p>Croqui de Campo · versão 1.1</p>
    <div class="acts"><button class="pill pri" data-ok>Entendi</button></div>`, (sh) => { sh.querySelector('[data-ok]').onclick = closeSheet; });
}


/* ---------- croqui por foto: o Claude lê o desenho do papel ---------- */
const SKETCH_PROMPT = `Você recebe a FOTO de um croqui de levantamento de edificação feito à mão (planta baixa), por um engenheiro civil no Brasil.
Transforme o desenho em geometria. Responda SOMENTE com um objeto JSON neste formato:
{"walls":[{"x1":0,"y1":0,"x2":5,"y2":0,"len":5.0,"openings":[{"type":"P","pos":0.3,"w":0.8,"label":"P1"}]}],
 "labels":[{"x":2.5,"y":2,"text":"SALA"}],
 "pillars":[{"x":0,"y":0}],
 "notes":"observações curtas sobre o que ficou duvidoso"}
Regras:
- Coordenadas em METROS, origem no canto inferior esquerdo do desenho, eixo y para CIMA (na foto, para cima da folha).
- Cada parede é um segmento reto pelo EIXO da parede. Paredes que se encontram num canto usam EXATAMENTE as mesmas coordenadas nesse ponto. Uma parede que encosta no meio de outra (encontro em T) termina exatamente sobre a outra.
- Corrija a imprecisão do traço à mão: paredes que parecem horizontais ou verticais devem ficar exatamente horizontais ou verticais.
- "len": a medida escrita no croqui para aquela parede, em metros (ex.: "3,45" ou "345" cm → 3.45). Se não houver medida legível, use null e estime as coordenadas pela proporção do desenho e pelas medidas escritas nas outras paredes.
- Use as medidas escritas para dar escala ao desenho todo.
- "openings": portas (P), janelas (J) ou vãos (V) na parede; "pos" é a posição do CENTRO da abertura de 0 a 1, medida a partir do ponto (x1,y1); "w" a largura em metros se escrita, senão null.
- "labels": nomes de ambientes escritos (SALA, COZINHA, BWC...). "pillars": pilares marcados.
- Não invente paredes que não estão no desenho. Se a foto não for um croqui de planta, responda {"walls":[],"notes":"motivo"}.`;
let photoFile = null, photoCtl = null;
async function photoSheet() {
  const sample = await cap('sample');
  const lim = sample ? await sample.limits().catch(() => null) : null;
  if (!sample || !lim || !lim.images) { toast('Leitura por foto indisponível.'); return; }
  photoFile = null;
  openSheet(`<h2>Ler croqui de uma foto</h2>
    ${getKey() ? '' : '<p><b>Falta a chave da API.</b> Cadastre no menu ⋯ › Chave da API. Sem ela, desenhe à mão normalmente.</p>'}
    <p>Fotografe o croqui feito no papel, de cima e com boa luz. As medidas escritas no desenho são lidas e usadas para dar escala. Depois, confira tudo e corrija o que precisar.</p>
    <input type="file" id="fPh" accept="${esc(lim.images.mediaTypes.join(','))}" hidden>
    <div class="acts" style="margin-bottom:12px"><button class="pill" data-pick>Escolher foto ou câmera</button></div>
    <img id="phPrev" alt="Prévia do croqui" style="display:none;width:100%;max-height:260px;object-fit:contain;border:1px solid var(--line);border-radius:10px;margin-bottom:12px">
    ${P.walls.length ? '<p><b>Atenção:</b> o que for lido será somado ao desenho atual.</p>' : ''}
    <p id="phStat" role="status"></p>
    <div class="acts"><button class="pill" data-x>Fechar</button><button class="pill pri" data-go disabled>Ler croqui</button></div>`, (sh) => {
    const inp = sh.querySelector('#fPh'), go = sh.querySelector('[data-go]'), stat = sh.querySelector('#phStat');
    sh.querySelector('[data-pick]').onclick = () => inp.click();
    inp.onchange = () => {
      const f = inp.files[0]; if (!f) return;
      if (f.size > lim.images.maxInputBytes) { stat.textContent = 'Foto grande demais. Use outra.'; return; }
      photoFile = f; go.disabled = false;
      const im = sh.querySelector('#phPrev'); try { im.src = URL.createObjectURL(f); im.style.display = 'block'; } catch (e) {}
    };
    sh.querySelector('[data-x]').onclick = () => { if (photoCtl) photoCtl.abort(); closeSheet(); };
    go.onclick = async () => {
      if (!photoFile) return;
      if (photoCtl) { photoCtl.abort(); return; }
      photoCtl = new AbortController();
      go.textContent = 'Parar'; stat.textContent = 'Lendo o croqui… pode levar até um minuto.';
      try {
        const data = await sample.json(SKETCH_PROMPT, { images: [photoFile], signal: photoCtl.signal, modelTier: 'complex' });
        if (!data || !Array.isArray(data.walls) || !data.walls.length) { stat.textContent = 'Não encontrei paredes nessa foto. ' + (data && data.notes ? String(data.notes) : 'Tente outra foto, mais de perto.'); return; }
        pushUndo();
        const r = C.fromSketch(P, data);
        closeSheet(); changed(); fit();
        const f = C.paredes(P).filter((w) => w.len == null).length;
        openSheet(`<h2>Croqui lido</h2>
          <p>${r.total} paredes criadas${r.measured ? ` e ${r.measured} medidas lidas do papel` : ''}.${f ? ` ${f} ficaram sem medida (laranja): use <b>Medir</b>.` : ''} Onde uma parede medida foi dividida por outra, a medida virou uma cota <b>Total</b> para conferência.</p>
          ${data.notes ? `<p><b>Observação da leitura:</b> ${esc(String(data.notes).slice(0, 400))}</p>` : ''}
          <p>Confira se as medidas foram lidas pela face certa (interna, eixo ou externa) tocando em cada parede.</p>
          <div class="acts"><button class="pill" data-u>Desfazer leitura</button><button class="pill pri" data-ok>OK</button></div>`, (s2) => {
          s2.querySelector('[data-u]').onclick = () => { closeSheet(); undo(); fit(); };
          s2.querySelector('[data-ok]').onclick = closeSheet;
        });
      } catch (e) {
        const c = e && e.code;
        stat.textContent = c === 'no_key' ? 'Cadastre a chave da API no menu ⋯ › Chave da API.' : c === 'bad_key' ? 'Chave da API inválida ou sem crédito. Confira no console da Anthropic.' : c === 'offline' ? 'Sem internet: a leitura por foto precisa de conexão.' : c === 'cancelled' ? 'Leitura interrompida.' : c === 'not_granted' ? 'O uso do Claude não foi autorizado nesta página.' : c === 'rate_limited' ? 'Muitas leituras seguidas ou limite de uso atingido. Tente mais tarde.' : c === 'image_rejected' ? 'Essa imagem não pôde ser usada. Tente outra foto.' : c === 'invalid_json' ? 'A leitura saiu incompleta. Toque em Ler croqui de novo.' : c === 'refused' ? 'A foto não pôde ser lida. Tente outra.' : 'Falha na leitura. Tente de novo.';
      } finally { photoCtl = null; go.textContent = 'Ler croqui'; }
    };
  });
}
/* ---------- conferência ---------- */
function doAdjust() {
  if (!P.walls.length) { toast('Desenhe as paredes primeiro.'); return; }
  const r = C.report(P);
  const missing = r.total - r.measured;
  const iss = r.issues.map((i) => `<li><button class="linkbtn" style="padding:0;min-height:0" data-w="${i.wall}">Parede ${i.num}</button>: medida ${C.fmt(i.med)} × desenho ${C.fmt(i.got)} (<span class="badc">${i.diff > 0 ? '+' : ''}${C.fmt(i.diff * 100, 0)} cm</span>)</li>`).join('');
  const chk = r.checks.map((c) => `<li>${c.total ? 'Total' : 'D' + c.num}: ${c.med == null ? 'sem medida' : `medida ${C.fmt(c.med)} × desenho ${C.fmt(c.got)} — ${Math.abs(c.diff) <= 0.02 ? '<span class="okc">confere</span>' : `<span class="badc">${c.diff > 0 ? '+' : ''}${C.fmt(c.diff * 100, 0)} cm</span>`}`}</li>`).join('');
  openSheet(`<h2>Conferência das medidas</h2>
    <p>${r.measured} de ${r.total} paredes com medida.${missing ? ` ${missing} sem medida (cotas "~" em laranja).` : ''}</p>
    <ul class="rep">${r.issues.length ? `<li><span class="badc">Medidas que não batem com o desenho</span> (toque para abrir a parede e reaplicar a medida):</li>${iss}` : '<li><span class="okc">Todas as paredes medidas batem com o desenho.</span></li>'}${chk}</ul>
    <div class="acts"><button class="pill pri" data-ok>OK</button></div>`, (sh) => {
    sh.querySelector('[data-ok]').onclick = closeSheet;
    sh.querySelectorAll('[data-w]').forEach((b) => b.onclick = () => { const w = P.walls.find((x) => x.id === b.dataset.w); closeSheet(); if (w) { sel = { type: 'wall', id: w.id }; wallSheet(w); centerOn(w); } });
  });
}

/* ---------- exportação ---------- */
const slug = (s) => (String(s || 'levantamento').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w-]+/g, '_').replace(/_+/g, '_').replace(/^_|_$/g, '') || 'levantamento').slice(0, 60);
async function saveFile(name, data) {
  try {
    const blob = data instanceof Blob ? data : new Blob([data], { type: 'application/octet-stream' });
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast('Arquivo salvo em Downloads: ' + name); return true;
  } catch (e) { toast('Não foi possível salvar o arquivo.'); return false; }
}
async function exportZip() {
  if (!P.walls.length) { toast('Nada para exportar ainda.'); return; }
  const unmeasured = C.paredes(P).filter((w) => w.len == null).length;
  await saveFile(slug(P.name) + '.dxf', new Blob([C.toDXF(P)], { type: 'application/dxf' }));
  if (unmeasured) setTimeout(() => toast(`${unmeasured} parede(s) sem medida saíram com cota "~" (estimada).`), 1500);
}

/* ---------- início ---------- */
readColors();
readLocal();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
let installEvt = null;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvt = e; $('#bInstall').hidden = false; });
$('#bInstall').onclick = async () => { if (!installEvt) return; installEvt.prompt(); try { await installEvt.userChoice; } catch (e) {} installEvt = null; $('#bInstall').hidden = true; };
renderHome();
initCloud();
window.addEventListener('pagehide', () => { if (P) { P.updatedAt = Date.now(); mem[P.id] = P; writeLocal(); } });
}

</script>
<script>{
  const st = (t, ok) => { const el = document.getElementById('offStat'); if (el) { el.textContent = t; el.style.color = ok ? 'var(--ok)' : 'var(--muted)'; } };
  if (!('serviceWorker' in navigator)) st('Este navegador não permite o uso sem internet.', false);
  else {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => st('Não foi possível ativar o uso sem internet.', false)));
    const upd = () => st(navigator.serviceWorker.controller ? '✓ Pronto para usar sem internet neste celular.' : 'Para ativar o uso sem internet: feche e abra o app uma vez com internet.', !!navigator.serviceWorker.controller);
    navigator.serviceWorker.ready.then(upd); navigator.serviceWorker.addEventListener('controllerchange', upd); upd();
  }
}</script>
